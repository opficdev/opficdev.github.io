locale: "ko-KR"
title: "opficdev"
title_separator: "-"
name: "opficdev"
description: "기록하는 iOS 개발자"
url: "https://opficdev.github.io"
baseurl: ""
repository: "opficdev/opficdev.github.io"
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"

search: true
show_excerpts: true
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Asia/Seoul
words_per_minute: 200

author:
  name: "opficdev"
  bio: "기록하는 iOS 개발자"
  avatar:

logo:

include:
  - _pages

plugins:
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: false
      share: true
      related: true
      show_date: true
